<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteSentinel | Dashboard</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">
            <h1>SiteSentinel</h1>
        </div>
        <nav>
            <ul>
                <li class="active"><a href="#">Dashboard</a></li>
                <li><a href="#">History</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h2>Monitoring Overview</h2>
            <div class="user-info">UserID: 101</div>
        </header>

        <section class="card add-site">
            <h3>Add New Target</h3>
            <form class="site-form">
                <input type="url" placeholder="https://example.com" required id="url-input">
                <input type="number" placeholder="Interval (sec)" required id="interval-input" min="10">
                <button type="button" class="btn-primary" id="add-btn">Start Monitoring</button>
            </form>
        </section>

        <section class="card table-container">
            <h3>Monitored Sites</h3>
            <table>
                <thead>
                <tr>
                    <th>Status</th>
                    <th>URL</th>
                    <th>Latency</th>
                    <th>Last Check</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="sites-table-body">
                </tbody>
            </table>
        </section>
    </main>
</div>
<script src="../static/js/script.js"></script>
</body>
</html>
