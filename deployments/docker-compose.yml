services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor-service:
    build:
      context: ..
      dockerfile: services/monitor-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:8080"
    environment:
      - DB_SOURCE=${MONITOR_DB_URL}
      - RABBIT_URL=${RABBIT_URL}

  checker-service:
    build:
      context: ..
      dockerfile: services/checker-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DB_SOURCE=${CHECKER_DB_URL}
      - RABBIT_URL=${RABBIT_URL}

  front-end:
    build:
      context: ../front-end
      dockerfile: Dockerfile
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      - monitor-service

volumes:
  postgres_data:
  rabbit_data: